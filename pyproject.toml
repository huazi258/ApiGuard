[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "apiguard"
version = "0.1.0"
description = "A bounded API verification tool for FastAPI/OpenAPI services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apiguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"src/apiguard/infrastructure/persistence/orm.py" = ["E501"]
"tests/integration/persistence/test_schema_constraints.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
